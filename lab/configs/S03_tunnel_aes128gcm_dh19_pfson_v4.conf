# Scenario S03: IKEv2 Tunnel Mode, AES-128-GCM, DH Group 19 (256-bit ECP), PFS On, IPv4
# Reference: Modern Elliptic Curve Diffie-Hellman (RFC 8247)

connections {
    vpn-scenario {
        version = 2
        local_addrs = %LOCAL_IP%
        remote_addrs = %REMOTE_IP%
        proposals = aes128gcm16-prfsha256-ecp256,aes128-sha256-ecp256
        
        local {
            auth = psk
            id = %LOCAL_ID%
        }
        remote {
            auth = psk
            id = %REMOTE_ID%
        }
        
        children {
            vpn-child {
                mode = tunnel
                esp_proposals = aes128gcm16-ecp256,aes128gcm16
                local_ts = %LOCAL_TS%
                remote_ts = %REMOTE_TS%
                rekey_time = 3600s
                start_action = none
            }
        }
    }
}
