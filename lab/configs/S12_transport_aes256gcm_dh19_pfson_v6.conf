# Scenario S12: IKEv2 Transport Mode, AES-256-GCM, DH Group 19 (256-bit ECP), PFS On, IPv6
# Reference: IPv6 Dual-Stack Host-to-Host Transport Mode

connections {
    vpn-scenario {
        version = 2
        local_addrs = %LOCAL_IPV6%
        remote_addrs = %REMOTE_IPV6%
        proposals = aes256gcm16-prfsha384-ecp256,aes256gcm16-prfsha256-ecp256
        
        local {
            auth = psk
            id = %LOCAL_ID%
        }
        remote {
            auth = psk
            id = %REMOTE_ID%
        }
        
        children {
            vpn-child {
                mode = transport
                esp_proposals = aes256gcm16-ecp256,aes256gcm16
                local_ts = %LOCAL_TS_V6%
                remote_ts = %REMOTE_TS_V6%
                rekey_time = 3600s
                start_action = none
            }
        }
    }
}
