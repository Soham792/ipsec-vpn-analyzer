# Scenario S07: IKEv1 Tunnel Mode, AES-128-CBC + HMAC-MD5-96, DH Group 1 (768-bit), PFS Off, IPv4
# Reference: Critical Security Vulnerability (Broken MD5, Logjam/768-bit MODP, IKEv1)

connections {
    vpn-scenario {
        version = 1
        local_addrs = %LOCAL_IP%
        remote_addrs = %REMOTE_IP%
        proposals = aes128-md5-modp768,aes128-sha1-modp1024
        
        local {
            auth = psk
            id = %LOCAL_ID%
        }
        remote {
            auth = psk
            id = %REMOTE_ID%
        }
        
        children {
            vpn-child {
                mode = tunnel
                esp_proposals = aes128-md5
                local_ts = %LOCAL_TS%
                remote_ts = %REMOTE_TS%
                rekey_time = 86400s
                start_action = none
            }
        }
    }
}
