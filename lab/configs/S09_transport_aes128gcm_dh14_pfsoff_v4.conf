# Scenario S09: IKEv2 Transport Mode, AES-128-GCM, DH Group 14 (2048-bit), PFS Off, IPv4
# Reference: Moderate transport mode with PFS off

connections {
    vpn-scenario {
        version = 2
        local_addrs = %LOCAL_IP%
        remote_addrs = %REMOTE_IP%
        proposals = aes128gcm16-prfsha256-modp2048,aes128-sha256-modp2048
        
        local {
            auth = psk
            id = %LOCAL_ID%
        }
        remote {
            auth = psk
            id = %REMOTE_ID%
        }
        
        children {
            vpn-child {
                mode = transport
                esp_proposals = aes128gcm16
                local_ts = %LOCAL_TS%
                remote_ts = %REMOTE_TS%
                rekey_time = 7200s
                start_action = none
            }
        }
    }
}
