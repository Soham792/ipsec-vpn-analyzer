# Scenario S05: IKEv2 Transport Mode, AES-256-GCM, DH Group 19 (256-bit ECP), PFS On, IPv4
# Reference: High-performance Host-to-Host Modern Transport Mode

connections {
    vpn-scenario {
        version = 2
        local_addrs = %LOCAL_IP%
        remote_addrs = %REMOTE_IP%
        proposals = aes256gcm16-prfsha384-ecp256,aes256gcm16-prfsha256-ecp256
        
        local {
            auth = psk
            id = %LOCAL_ID%
        }
        remote {
            auth = psk
            id = %REMOTE_ID%
        }
        
        children {
            vpn-child {
                mode = transport
                esp_proposals = aes256gcm16-ecp256,aes256gcm16
                local_ts = %LOCAL_TS%
                remote_ts = %REMOTE_TS%
                rekey_time = 3600s
                start_action = none
            }
        }
    }
}
