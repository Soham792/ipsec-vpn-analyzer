# Scenario S06: IKEv2 Tunnel Mode, 3DES-CBC + HMAC-SHA1-96, DH Group 2 (1024-bit), PFS Off, IPv4
# Reference: Insecure / Deprecated Suite (Sweet32 vulnerability, weak DH)

connections {
    vpn-scenario {
        version = 2
        local_addrs = %LOCAL_IP%
        remote_addrs = %REMOTE_IP%
        proposals = 3des-sha1-modp1024,aes128-sha1-modp1024
        
        local {
            auth = psk
            id = %LOCAL_ID%
        }
        remote {
            auth = psk
            id = %REMOTE_ID%
        }
        
        children {
            vpn-child {
                mode = tunnel
                esp_proposals = 3des-sha1
                local_ts = %LOCAL_TS%
                remote_ts = %REMOTE_TS%
                rekey_time = 86400s
                start_action = none
            }
        }
    }
}
