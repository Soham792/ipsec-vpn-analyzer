# Scenario S11: IKEv2 Tunnel Mode, AES-256-GCM, DH Group 14, PFS On, IPv6
# Reference: IPv6 Dual-Stack Enterprise VPN Tunnel

connections {
    vpn-scenario {
        version = 2
        local_addrs = %LOCAL_IPV6%
        remote_addrs = %REMOTE_IPV6%
        proposals = aes256gcm16-prfsha256-modp2048,aes256-sha256-modp2048
        
        local {
            auth = psk
            id = %LOCAL_ID%
        }
        remote {
            auth = psk
            id = %REMOTE_ID%
        }
        
        children {
            vpn-child {
                mode = tunnel
                esp_proposals = aes256gcm16-modp2048,aes256gcm16
                local_ts = %LOCAL_TS_V6%
                remote_ts = %REMOTE_TS_V6%
                rekey_time = 3600s
                start_action = none
            }
        }
    }
}
