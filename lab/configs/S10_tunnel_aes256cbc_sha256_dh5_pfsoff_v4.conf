# Scenario S10: IKEv2 Tunnel Mode, AES-256-CBC + HMAC-SHA256, DH Group 5 (1536-bit MODP), PFS Off, IPv4
# Reference: Medium Security DH Group (DH5 is legacy transitional)

connections {
    vpn-scenario {
        version = 2
        local_addrs = %LOCAL_IP%
        remote_addrs = %REMOTE_IP%
        proposals = aes256-sha256-modp1536,aes256-sha256-modp2048
        
        local {
            auth = psk
            id = %LOCAL_ID%
        }
        remote {
            auth = psk
            id = %REMOTE_ID%
        }
        
        children {
            vpn-child {
                mode = tunnel
                esp_proposals = aes256-sha256
                local_ts = %LOCAL_TS%
                remote_ts = %REMOTE_TS%
                rekey_time = 7200s
                start_action = none
            }
        }
    }
}
