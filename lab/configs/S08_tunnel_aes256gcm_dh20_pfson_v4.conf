# Scenario S08: IKEv2 Tunnel Mode, AES-256-GCM, DH Group 20 (384-bit ECP / P-384), PFS On, IPv4
# Reference: High-Grade Security / CNSA Suite

connections {
    vpn-scenario {
        version = 2
        local_addrs = %LOCAL_IP%
        remote_addrs = %REMOTE_IP%
        proposals = aes256gcm16-prfsha384-ecp384,aes256gcm16-prfsha256-ecp256
        
        local {
            auth = psk
            id = %LOCAL_ID%
        }
        remote {
            auth = psk
            id = %REMOTE_ID%
        }
        
        children {
            vpn-child {
                mode = tunnel
                esp_proposals = aes256gcm16-ecp384,aes256gcm16
                local_ts = %LOCAL_TS%
                remote_ts = %REMOTE_TS%
                rekey_time = 3600s
                start_action = none
            }
        }
    }
}
