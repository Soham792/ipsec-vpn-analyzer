# Scenario S13: IKEv1 Tunnel Mode, AES-256-CBC + HMAC-SHA1, DH Group 14, PFS On, IPv4
# Reference: Legacy IKEv1 Protocol with Modern DH/AES

connections {
    vpn-scenario {
        version = 1
        local_addrs = %LOCAL_IP%
        remote_addrs = %REMOTE_IP%
        proposals = aes256-sha1-modp2048,aes256-sha256-modp2048
        
        local {
            auth = psk
            id = %LOCAL_ID%
        }
        remote {
            auth = psk
            id = %REMOTE_ID%
        }
        
        children {
            vpn-child {
                mode = tunnel
                esp_proposals = aes256-sha1-modp2048,aes256-sha1
                local_ts = %LOCAL_TS%
                remote_ts = %REMOTE_TS%
                rekey_time = 3600s
                start_action = none
            }
        }
    }
}
