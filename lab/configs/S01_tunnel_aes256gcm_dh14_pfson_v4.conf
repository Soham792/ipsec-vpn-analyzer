# Scenario S01: IKEv2 Tunnel Mode, AES-256-GCM, DH Group 14 (2048-bit), PFS On, IPv4
# Reference: NIST SP 800-77 / RFC 8247 (Strong / Recommended)

connections {
    vpn-scenario {
        version = 2
        local_addrs = %LOCAL_IP%
        remote_addrs = %REMOTE_IP%
        proposals = aes256gcm16-prfsha256-modp2048,aes256-sha256-modp2048
        
        local {
            auth = psk
            id = %LOCAL_ID%
        }
        remote {
            auth = psk
            id = %REMOTE_ID%
        }
        
        children {
            vpn-child {
                mode = tunnel
                esp_proposals = aes256gcm16-modp2048,aes256gcm16
                local_ts = %LOCAL_TS%
                remote_ts = %REMOTE_TS%
                rekey_time = 3600s
                start_action = none
            }
        }
    }
}
