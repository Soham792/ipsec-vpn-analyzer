services:
  node-a:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: node-a
    hostname: node-a
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.all.disable_ipv6=0
    environment:
      - NODE_ROLE=initiator
      - NODE_A_IP=172.28.0.10
      - NODE_B_IP=172.28.0.20
      - NODE_A_IPV6=fd00:abcd:1234::10
      - NODE_B_IPV6=fd00:abcd:1234::20
    volumes:
      - ../data:/workspace/data
      - .:/workspace/lab
    networks:
      vpn-net:
        ipv4_address: 172.28.0.10
        ipv6_address: fd00:abcd:1234::10

  node-b:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: node-b
    hostname: node-b
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.all.disable_ipv6=0
    environment:
      - NODE_ROLE=responder
      - NODE_A_IP=172.28.0.10
      - NODE_B_IP=172.28.0.20
      - NODE_A_IPV6=fd00:abcd:1234::10
      - NODE_B_IPV6=fd00:abcd:1234::20
    volumes:
      - ../data:/workspace/data
      - .:/workspace/lab
    networks:
      vpn-net:
        ipv4_address: 172.28.0.20
        ipv6_address: fd00:abcd:1234::20

networks:
  vpn-net:
    driver: bridge
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
        - subnet: fd00:abcd:1234::/64
          gateway: fd00:abcd:1234::1
