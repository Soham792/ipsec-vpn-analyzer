# Scenario S02: IKEv2 Transport Mode, AES-128-CBC + HMAC-SHA256, DH Group 2 (1024-bit), PFS Off, IPv4
# Reference: Legacy / Weak DH group, PFS disabled

connections {
    vpn-scenario {
        version = 2
        local_addrs = %LOCAL_IP%
        remote_addrs = %REMOTE_IP%
        proposals = aes128-sha256-modp1024,aes128-sha256-modp2048
        
        local {
            auth = psk
            id = %LOCAL_ID%
        }
        remote {
            auth = psk
            id = %REMOTE_ID%
        }
        
        children {
            vpn-child {
                mode = transport
                esp_proposals = aes128-sha256
                local_ts = %LOCAL_TS%
                remote_ts = %REMOTE_TS%
                rekey_time = 7200s
                start_action = none
            }
        }
    }
}
