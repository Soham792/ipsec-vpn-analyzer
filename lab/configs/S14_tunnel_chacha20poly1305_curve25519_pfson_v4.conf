# Scenario S14: IKEv2 Tunnel Mode, ChaCha20-Poly1305 AEAD, Curve25519 (Group 31), PFS On, IPv4
# Reference: RFC 8247 Next-Gen Lightweight / High-Security Suite

connections {
    vpn-scenario {
        version = 2
        local_addrs = %LOCAL_IP%
        remote_addrs = %REMOTE_IP%
        proposals = aes256gcm16-prfsha256-curve25519,aes256gcm16-prfsha256-modp2048
        
        local {
            auth = psk
            id = %LOCAL_ID%
        }
        remote {
            auth = psk
            id = %REMOTE_ID%
        }
        
        children {
            vpn-child {
                mode = tunnel
                esp_proposals = aes256gcm16-curve25519,aes256gcm16
                local_ts = %LOCAL_TS%
                remote_ts = %REMOTE_TS%
                rekey_time = 3600s
                start_action = none
            }
        }
    }
}
